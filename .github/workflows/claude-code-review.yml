name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Renovate opens dependency PRs as renovate[bot]. The action rejects that
    # actor. cursor[bot] stays in allowed_bots and still gets a review.
    # Mergify opens merge-queue PRs as mergify[bot]. Skip that actor.
    # A branch name is not a check. A contributor can name a branch mergify/.
    if: github.event.pull_request.user.login != 'renovate[bot]' && github.event.pull_request.user.login != 'mergify[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # Cursor Cloud Agent pushes as cursor[bot]; without this the action
          # fails on pull_request synchronize with a non-human-actor error.
          # Do not use '*' on this public MIT repo.
          allowed_bots: 'cursor[bot]'
          # The action hides the output of the SDK. Without this, a run that
          # fails reports `is_error: true` and no message.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
