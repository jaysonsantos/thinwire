# Unsigned OS zips on main only. These are not releases.
# pull_request never triggers this workflow, and the job also refuses non-main pushes.
#
# TELEGRAM_API_ID and TELEGRAM_API_HASH are publisher Telegram app credentials.
# This main-only workflow reads them from GitHub Actions repository secrets and
# passes them to cargo so option_env! can bake them in. Never add these secrets
# to ci.yml or any pull_request workflow. Never log the values. Real values live
# in GitHub repository secrets and in arcoiro under the thinwire path
# (SOPS + Terraform, not watchkeep), not in this MIT tree.
name: OS zips

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  os-zips:
    name: zip-${{ matrix.artifact }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            cmake \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libc++-dev \
            libc++abi-dev \
            patchelf
          # libc++-dev pulls libunwind-18-dev. Do not also install libunwind-dev;
          # those packages conflict.

      - name: Install Rust toolchain
        run: rustup show

      - name: Require publisher Telegram credentials
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set +x
          set -euo pipefail
          # Do not echo TELEGRAM_API_ID or TELEGRAM_API_HASH.
          # Trim leading and trailing whitespace only. Embedded spaces stay,
          # so they fail ^[0-9]+$. Cargo still receives the original values.
          trim_edges() {
            local s="$1"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }
          id_trimmed=$(trim_edges "$TELEGRAM_API_ID")
          hash_trimmed=$(trim_edges "$TELEGRAM_API_HASH")
          if [[ -z "$id_trimmed" || -z "$hash_trimmed" || ! "$id_trimmed" =~ ^[0-9]+$ ]]; then
            echo "::error::Official OS zip refused: set repository secrets TELEGRAM_API_ID and TELEGRAM_API_HASH. TELEGRAM_API_ID must be a number. This job will not upload a credentials-missing binary."
            exit 1
          fi

      - name: Build release binary
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: cargo build --release -p thinwire --features telegram-tdlib

      - name: Zip unsigned binary
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          # Notices land in dist before make_archive. The tdlib-rs prebuilt
          # zip has no license file. This copy is the Boost Software License
          # from tdlib/td 11e254af695060d8890024dd7faa1cc2d6685ef8 (1.8.61).
          mkdir -p dist/THIRD_PARTY_NOTICES
          cp LICENSE dist/LICENSE
          tdlib_license=third_party/tdlib/LICENSE_1_0.txt
          if [[ ! -f "$tdlib_license" ]]; then
            echo "::error::Missing vendored TDLib Boost license at ${tdlib_license}."
            exit 1
          fi
          cp "$tdlib_license" dist/THIRD_PARTY_NOTICES/tdlib-LICENSE_1_0.txt
          copy_llvm_notice() {
            local lib="$1"
            local owner=""
            local pkg=""
            local doc=""
            local real=""
            owner=$(dpkg -S "$lib" 2>/dev/null || true)
            owner=${owner%%$'\n'*}
            if [[ -z "$owner" ]]; then
              real=$(readlink -f "$lib")
              owner=$(dpkg -S "$real" 2>/dev/null || true)
              owner=${owner%%$'\n'*}
            fi
            if [[ -z "$owner" ]]; then
              echo "::error::No package owns ${lib}; refusing to ship it without its redistribution notice."
              exit 1
            fi
            pkg=${owner%%: /*}
            pkg=${pkg%%:*}
            doc="/usr/share/doc/${pkg}/copyright"
            if [[ ! -f "$doc" ]]; then
              echo "::error::Redistribution notice missing at ${doc} for ${lib}."
              exit 1
            fi
            cp "$doc" "dist/THIRD_PARTY_NOTICES/${pkg}.copyright"
          }
          if [[ -f target/release/thinwire.exe ]]; then
            cp target/release/thinwire.exe dist/
            bin=dist/thinwire.exe
          else
            cp target/release/thinwire dist/
            bin=dist/thinwire
          fi
          if [[ "$(uname -s)" == "Linux" ]]; then
            # Static TDLib still loads the LLVM C++ runtime. Ship those sonames
            # beside the binary. Do not copy libc or other system loaders.
            copied=0
            while IFS= read -r lib; do
              if [[ -z "$lib" || ! -f "$lib" ]]; then
                echo "::error::Linux zip is missing a TDLib C++ runtime library. Refusing to upload a binary that cannot load TDLib."
                exit 1
              fi
              so="dist/$(basename "$lib")"
              cp -L "$lib" "$so"
              # On the runtime itself, so libc++abi and libunwind resolve from
              # $ORIGIN whether patchelf writes DT_RPATH or DT_RUNPATH.
              patchelf --set-rpath '$ORIGIN' "$so"
              copy_llvm_notice "$lib"
              copied=$((copied + 1))
            done < <(ldd "$bin" | awk '/libc\+\+\.so|libc\+\+abi\.so|libunwind\.so/ { print $3 }')
            if [[ "$copied" -lt 1 ]]; then
              echo "::error::Linux zip did not find the LLVM C++ runtime required by static TDLib. Refusing to upload."
              exit 1
            fi
            patchelf --set-rpath '$ORIGIN' "$bin"
          fi
          if command -v python3 >/dev/null; then
            PY=python3
          else
            PY=python
          fi
          "$PY" - <<'PY'
          import os
          import shutil

          name = os.environ["ARTIFACT"]
          shutil.make_archive(f"thinwire-{name}", "zip", "dist")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thinwire-${{ matrix.artifact }}
          path: thinwire-${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 7
