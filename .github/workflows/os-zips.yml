# Unsigned OS artifacts on main only. These are not releases.
# GitHub wraps every artifact download in an outer zip. The uploaded file is
# one mode-preserving .tar.gz so executable bits and the macOS .app survive.
# pull_request never triggers this workflow, and the job also refuses non-main pushes.
#
# TELEGRAM_API_ID and TELEGRAM_API_HASH are publisher Telegram app credentials.
# This main-only workflow reads them from GitHub Actions repository secrets and
# passes them to cargo so option_env! can bake them in. Never add these secrets
# to ci.yml or any pull_request workflow. Never log the values. Real values live
# in GitHub repository secrets and in arcoiro under the thinwire path
# (SOPS + Terraform, not watchkeep), not in this MIT tree.
name: OS artifacts

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  os-zips:
    name: artifact-${{ matrix.artifact }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            cmake \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libc++-dev \
            libc++abi-dev \
            patchelf
          # libc++-dev pulls libunwind-18-dev. Do not also install libunwind-dev;
          # those packages conflict.

      - name: Install Rust toolchain
        run: rustup show

      - name: Require publisher Telegram credentials
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set +x
          set -euo pipefail
          # Do not echo TELEGRAM_API_ID or TELEGRAM_API_HASH.
          # Trim leading and trailing whitespace only. Embedded spaces stay,
          # so they fail ^[0-9]+$. Cargo still receives the original values.
          trim_edges() {
            local s="$1"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }
          id_trimmed=$(trim_edges "$TELEGRAM_API_ID")
          hash_trimmed=$(trim_edges "$TELEGRAM_API_HASH")
          if [[ -z "$id_trimmed" || -z "$hash_trimmed" || ! "$id_trimmed" =~ ^[0-9]+$ ]]; then
            echo "::error::Official OS zip refused: set repository secrets TELEGRAM_API_ID and TELEGRAM_API_HASH. TELEGRAM_API_ID must be a number. This job will not upload a credentials-missing binary."
            exit 1
          fi

      - name: Build release binary
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: cargo build --release -p thinwire --features telegram-tdlib

      - name: Stage and archive unsigned payload
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: scripts/stage-os-artifact.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thinwire-${{ matrix.artifact }}
          path: thinwire-${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 7
