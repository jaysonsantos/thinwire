# Lint, test, and build. Tools come from the nix flake.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Lint
        run: nix develop --command scripts/lint.sh

  test:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Test
        run: nix develop --command scripts/test.sh

  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Build
        run: nix develop --command cargo build --workspace

  release-tree:
    name: release-tree
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Release cargo tree excludes AGPL Signal and wacore-libsignal
        run: nix develop --command scripts/check-release-tree.sh

  ui-snapshots:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Snapshot tests
        run: nix develop --command cargo test -p thinwire --features ui-snapshots ui_snapshots -- --test-threads=1
      - name: Upload snapshot images
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-snapshots
          path: crates/thinwire/tests/snapshots/**/*.png
          retention-days: 14
          if-no-files-found: ignore

  # The OS notification backends compile only on their own OS (#161). Run
  # them only when their code or the dependencies change, so most merge
  # queue runs skip them.
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      notify: ${{ steps.diff.outputs.notify }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find notification backend changes
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # An unknown base runs the OS jobs.
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git fetch --depth=1 --no-tags origin "$BASE"; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          paths='^(crates/thinwire-notify/|scripts/stage-os-artifact\.sh$|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'
          if git diff --name-only "$BASE" HEAD | grep -Eq "$paths"; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
          fi

  notify-os:
    name: notify-${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.notify == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show
      - name: Clippy
        run: cargo clippy -p thinwire-notify --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p thinwire-notify --locked
      # The notification center needs a signed bundle. Stage Thinwire.app
      # from a debug build (no publisher secrets) with the release script,
      # so its signature step is proven before main (#161).
      - name: Stage and check Thinwire.app
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARTIFACT: macos-arm64-check
          THINWIRE_BIN: target/debug/thinwire
        run: |
          cargo build -p thinwire --locked
          scripts/stage-os-artifact.sh
          mkdir -p unpacked
          tar -xzf thinwire-macos-arm64-check.tar.gz -C unpacked
          codesign --verify --strict --verbose=2 unpacked/Thinwire.app
          codesign --display --verbose=2 unpacked/Thinwire.app 2>&1 | tee codesign.txt
          grep -qx 'Identifier=dev.jaysonsantos.thinwire' codesign.txt
          grep -q '^Info.plist entries=' codesign.txt

  ui-snapshot-comment:
    needs: ui-snapshots
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (needs.ui-snapshots.result == 'success' || needs.ui-snapshots.result == 'failure')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.ui-snapshots.result == 'failure'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.ui-snapshots.result == 'failure'
        with:
          name: ui-snapshots
          path: snapshots
      - name: Write the comment
        if: needs.ui-snapshots.result == 'failure'
        env:
          RUN_ID: ${{ github.run_id }}
        run: scripts/snapshot-comment.sh snapshots "$RUN_ID" comment.md
      - name: Post one sticky comment
        if: needs.ui-snapshots.result == 'failure'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: thinwire-ui-snapshots
          path: comment.md
      - name: Clear the sticky comment
        if: needs.ui-snapshots.result == 'success'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: thinwire-ui-snapshots
          delete: true

  check:
    name: check
    if: always()
    needs: [lint, test, build, release-tree, ui-snapshots, changes, notify-os]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check the result of every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # Only notify-os can skip: no notification backend change.
          echo "$RESULTS" | jq --exit-status 'to_entries | all(.value.result == "success" or (.key == "notify-os" and .value.result == "skipped"))' > /dev/null
