[workspace]
resolver = "3"
members = ["crates/thinwire", "crates/thinwire-protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false
repository = "https://github.com/jaysonsantos/thinwire"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
thinwire-protocol = { path = "crates/thinwire-protocol" }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
