[package]
name = "thinwire"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Thin multi-protocol desktop messenger (Rust + egui)"
repository = "https://github.com/jaysonsantos/thinwire"
readme = "README.md"

[features]
default = []
# Compile-safe hook for a later official TDLib client via `tdlib-rs`.
# Default builds stay stubbed so CI does not need system TDLib or secrets.
# When wiring the real client: add an optional `tdlib-rs` dependency and a
# `build.rs`. Never commit `api_id`, `api_hash`, or session strings.
telegram-tdlib = []

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
