[workspace]
resolver = "3"
members = [
  "crates/thinwire",
  "crates/thinwire-core",
  "crates/thinwire-ipc",
  "crates/thinwire-notify",
  "crates/thinwire-protocol",
  "crates/thinwire-signal",
  "crates/thinwire-whatsapp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
publish = false
repository = "https://github.com/jaysonsantos/thinwire"

[workspace.lints.rust]
# `deny`, not `forbid`: one module may allow it. `scripts/check-unsafe.sh`
# names that module and fails on any other `unsafe` exception.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
# Glow only (council GUI A, ADR 0002). eframe 0.37 defaults include `wgpu`
# and `system_fonts`. `default-features = false` keeps both off. Do not
# enable `wgpu` or `wgpu_no_default_features`. Cargo rejects `winit/default`
# on a consumer of eframe; thinwire depends on `winit` with default features
# so unification matches the winit set eframe used to turn on by default.
# egui 0.37 has an empty default feature set. `default_fonts` is enabled
# through the eframe feature of the same name. Emoji left that set for
# `monochrome_emoji_fonts` (Noto Emoji and emoji-icon-font). The shell
# keeps that fallback after Inter, which is the coverage 0.36 shipped.
# `system_fonts` is on: for a character that no font of the app has (CJK,
# Arabic, and so on), eframe finds a font of the OS. A character that a font
# of the app has does not use it, so the layout of that text does not move.
# The color emoji font of the OS is a different step: `theme::system_emoji`.
# `clipboard` must stay on. Without it, egui-winit keeps a copy or a cut
# inside the app, and no other app can paste it.
eframe = { version = "0.37", default-features = false, features = [
  "accesskit",
  "clipboard",
  "default_fonts",
  "glow",
  "links",
  "system_fonts",
  "wayland",
  "x11",
] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
# The font list of the OS, for the color emoji font (`theme::system_emoji`).
# `egui_system_font_provider` links it with the same features.
fontique = { version = "0.11.1", default-features = false, features = [
  "fontconfig-dlopen",
  "system",
] }
# Local time for message timestamps. `clock` reads the OS time zone.
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
winit = "0.30"
thinwire-core = { path = "crates/thinwire-core" }
thinwire-ipc = { path = "crates/thinwire-ipc" }
thinwire-notify = { path = "crates/thinwire-notify" }
thinwire-protocol = { path = "crates/thinwire-protocol" }
thinwire-signal = { path = "crates/thinwire-signal" }
thinwire-whatsapp = { path = "crates/thinwire-whatsapp" }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
  "time",
] }
# The command line of a helper program (ADR 0013).
clap = { version = "4", features = ["derive", "env"] }
# The wire lines between the app and a helper process (ADR 0013).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"
# keyring v4 is a rewrite CLI/sample crate — apps must use keyring-core
# plus platform stores. Linux uses kernel keyutils so CI compiles without
# libdbus. Runtime falls back to memory when the platform store is unavailable.
keyring-core = "1"
linux-keyutils-keyring-store = "1"
# Secret Service (KDE Wallet / GNOME Keyring) over pure-Rust zbus: no libdbus
# at build time. async-io keeps its executor off the tokio blocking pool.
zbus-secret-service-keyring-store = { version = "1", features = [
  "rt-async-io-crypto-rust",
] }
# Only for the error type: tell "Secret Service not present" from a failure.
secret-service = { version = "5", default-features = false }
# `keychain` matches keyring v3's apple-native path for unsigned desktop apps.
apple-native-keyring-store = { version = "1", default-features = false, features = [
  "keychain",
] }
# No `search` (default) — sheds regex; Entry get/set/delete does not need it.
windows-native-keyring-store = { version = "1", default-features = false }

# crates.io tdlib-rs 1.4.0 requires zip 8. The revision below is that crate
# with zip 9.0.5, the first release that closes the critical zip extract
# advisory. Remove this patch when a crates.io release allows zip 9.0.5.
# The history of that revision is tdlib-rs. Do not merge it into thinwire main.
#
# rusqlite 0.41 requires libsqlite3-sys ^0.39. diesel 2.3.14 stops before
# 0.39, sqlx-sqlite 0.9.0 stops before 0.38, and presage-store-sqlite at
# 4b81740 pins 0.36.0. libsqlite3-sys sets `links = "sqlite3"`, so one
# version has to satisfy all of them. The revision is those sources with the
# bound moved to 0.39. The presage crate also names the same presage git
# revision instead of a path. Remove the patch when crates.io and presage
# allow 0.39 on their own.
#
# Both revisions are pinned. Keep those commits: the build fetches them by
# revision, and a missing commit fails the fetch. The sqlite revision is on
# branch `patch/sqlite-0-39-presage-4b81740`. Its parent 5a48941 is the same
# patch for presage 291c7ee.
[patch.crates-io]
tdlib-rs = { git = "https://github.com/jaysonsantos/thinwire", rev = "63582844ec64e072013ae6c7b7569b6b8648e4cc" }
sqlx-sqlite = { git = "https://github.com/jaysonsantos/thinwire", rev = "cdcc1cea3ebb6d51bd95dbcabc0ce1e7ec0872d4" }
diesel = { git = "https://github.com/jaysonsantos/thinwire", rev = "cdcc1cea3ebb6d51bd95dbcabc0ce1e7ec0872d4" }

[patch."https://github.com/whisperfish/presage"]
presage-store-sqlite = { git = "https://github.com/jaysonsantos/thinwire", rev = "cdcc1cea3ebb6d51bd95dbcabc0ce1e7ec0872d4" }
