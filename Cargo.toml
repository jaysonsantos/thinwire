[workspace]
resolver = "3"
members = [
  "crates/thinwire",
  "crates/thinwire-core",
  "crates/thinwire-protocol",
  "crates/thinwire-signal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false
repository = "https://github.com/jaysonsantos/thinwire"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
# Glow only (council GUI A). Do not enable wgpu or wgpu_no_default_features.
# Cargo rejects `winit/default` on a consumer of eframe; thinwire depends on
# `winit` with default features so unification matches eframe's default set.
eframe = { version = "0.36", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "glow",
  "links",
  "wayland",
  "x11",
] }
egui = "0.36"
# Local time for message timestamps. `clock` reads the OS time zone.
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
winit = "0.30"
thinwire-core = { path = "crates/thinwire-core" }
thinwire-protocol = { path = "crates/thinwire-protocol" }
thinwire-signal = { path = "crates/thinwire-signal" }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"
# keyring v4 is a rewrite CLI/sample crate — apps must use keyring-core
# plus platform stores. Linux uses kernel keyutils so CI compiles without
# libdbus. Runtime falls back to memory when the platform store is unavailable.
keyring-core = "1"
linux-keyutils-keyring-store = "1"
# Secret Service (KDE Wallet / GNOME Keyring) over pure-Rust zbus: no libdbus
# at build time. async-io keeps its executor off the tokio blocking pool.
zbus-secret-service-keyring-store = { version = "1", features = [
  "rt-async-io-crypto-rust",
] }
# Only for the error type: tell "Secret Service not present" from a failure.
secret-service = { version = "5", default-features = false }
# `keychain` matches keyring v3's apple-native path for unsigned desktop apps.
apple-native-keyring-store = { version = "1", default-features = false, features = [
  "keychain",
] }
# No `search` (default) — sheds regex; Entry get/set/delete does not need it.
windows-native-keyring-store = { version = "1", default-features = false }

# presage (feature `signal-local` only) needs Signal's curve25519-dalek fork.
# The patch is unused unless that feature is on. Release cargo trees stay off it.
[patch.crates-io]
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }
