[workspace]
resolver = "3"
members = ["crates/thinwire", "crates/thinwire-protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false
repository = "https://github.com/jaysonsantos/thinwire"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
# Glow only (council GUI A). Do not enable wgpu or wgpu_no_default_features.
# Cargo rejects `winit/default` on a consumer of eframe; thinwire depends on
# `winit` with default features so unification matches eframe's default set.
eframe = { version = "0.36", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "glow",
  "links",
  "wayland",
  "x11",
] }
egui = "0.36"
winit = "0.30"
thinwire-protocol = { path = "crates/thinwire-protocol" }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
# No default features: pick OS stores explicitly. Linux uses kernel
# keyutils so CI compiles without libdbus. Runtime falls back to memory
# when the platform store is unavailable.
keyring = { version = "4.0", default-features = false, features = [
  "apple-native",
  "windows-native",
  "linux-native",
] }
