[package]
name = "thinwire"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Thin multi-protocol desktop messenger (Rust + egui)"
repository = "https://github.com/jaysonsantos/thinwire"
readme = "README.md"

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
