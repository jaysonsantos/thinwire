# Run with `prek run --all-files`. Tools come from flake.nix.
exclude: ^(CHANGELOG\.md|flake\.lock|Cargo\.lock)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        files: \.rs$

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^(crates/|Cargo\.toml|Cargo\.lock)

      - id: taplo
        name: taplo fmt
        entry: taplo fmt --check
        language: system
        files: \.toml$

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.sh$

      - id: nixfmt
        name: nixfmt
        entry: nixfmt --check
        language: system
        files: \.nix$

      - id: typos
        name: typos
        entry: typos
        language: system
        exclude_types: [binary]

      - id: editorconfig
        name: editorconfig
        entry: editorconfig-checker
        language: system
        args: ["-exclude", "crates/thinwire-signal/LICENSE"]

      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --verbose --redact --staged
        language: system
        pass_filenames: false

      - id: zizmor
        name: zizmor
        entry: zizmor .github/workflows
        language: system
        pass_filenames: false
        files: ^\.github/workflows/
