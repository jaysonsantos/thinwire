[default]
# An SSH host key fingerprint is base64, not words.
extend-ignore-re = ["api_id", "api_hash", "SHA256:[A-Za-z0-9+/]{43}"]

[default.extend-words]
tdlib = "tdlib"
tdjson = "tdjson"
eframe = "eframe"
egui = "egui"
glow = "glow"
gpui = "gpui"
wgpu = "wgpu"
winit = "winit"
zizmor = "zizmor"
prek = "prek"
# Signal service identifier (ACI), not ACPI.
Aci = "Aci"
# whatsapp-rust field of the device phone number (`Device::pn`).
pn = "pn"
# Crate name. The checker splits the digit and reads flate as flat.
flate = "flate"
