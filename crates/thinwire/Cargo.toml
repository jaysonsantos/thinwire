[package]
name = "thinwire"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Thin multi-protocol desktop messenger (Rust + egui)"
readme = "../../README.md"

[features]
default = []
telegram-tdlib = [
  "thinwire-core/telegram-tdlib",
  "thinwire-protocol/telegram-tdlib",
]
slack-oauth = ["thinwire-core/slack-oauth", "thinwire-protocol/slack-oauth"]
# Experimental spike. Default CI and the default UI stay feature-off.
whatsapp-web = ["thinwire-core/whatsapp-web", "thinwire-protocol/whatsapp-web"]
discord-bot = ["thinwire-core/discord-bot", "thinwire-protocol/discord-bot"]
# Local-only AGPL Signal client. Release builds and OS zips leave this off.
signal-local = [
  "dep:qrcode",
  "dep:thinwire-signal",
  "thinwire-signal/signal-local",
  "thinwire-core/signal-local",
]
# Pixel snapshots. Off in the default test job. The ui-snapshots CI job turns it on.
ui-snapshots = ["egui_kittest/snapshot", "egui_kittest/wgpu"]

[dependencies]
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
thinwire-core.workspace = true
thinwire-protocol.workspace = true
thinwire-signal = { workspace = true, optional = true }
winit.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# QR for the Signal provisioning URI. Feature `signal-local` only.
qrcode = { version = "0.14", optional = true, default-features = false }

[dev-dependencies]
# A zone with daylight saving time for the layout tests (#122).
chrono-tz = "0.10"
egui_kittest = { version = "0.36", default-features = false }
thinwire-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
