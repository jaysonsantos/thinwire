[package]
name = "thinwire"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Thin multi-protocol desktop messenger (Rust + egui)"
readme = "../../README.md"

[features]
default = []
telegram-tdlib = [
  "thinwire-core/telegram-tdlib",
  "thinwire-protocol/telegram-tdlib",
]
slack-oauth = ["thinwire-core/slack-oauth", "thinwire-protocol/slack-oauth"]
# WhatsApp through the `thinwire-whatsapp-helper` process (ADR 0013). The
# app does not link the AGPL client: it talks to the helper over a pipe.
# Release builds turn this on. The default UI stays feature-off.
whatsapp-web = ["dep:qrcode", "thinwire-core/whatsapp-web"]
discord-bot = ["thinwire-core/discord-bot", "thinwire-protocol/discord-bot"]
# Signal through the `thinwire-signal-helper` process (ADR 0013, #248). The
# app does not link the AGPL client: it talks to the helper over a pipe.
# Release builds turn this on. The default UI stays feature-off.
signal-local = ["dep:qrcode", "thinwire-core/signal-local"]
# In-app video through GStreamer (ADR 0015). It links GStreamer at run time:
# the system or the dev shell must have it, with its base, good, and libav
# or platform decoder plugins.
video = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
# Every protocol of a release build, in one switch for a local build. It is the
# list of `release_features` in `scripts/test-release-features.sh` without the
# Cargo prefix, and `scripts/check-local-only-features.sh` keeps both the same.
# `video` is not a protocol: it is the in-app video player (ADR 0015). The OS
# zips do not have it yet.
all-protocols = [
  "telegram-tdlib",
  "slack-oauth",
  "discord-bot",
  "whatsapp-web",
  "signal-local",
  "video",
]
# macOS Keychain through /usr/bin/security. LOCAL BUILDS ONLY (see
# `thinwire-core`). `scripts/local-build.sh` is the one place that turns it on.
keychain-security-cli = ["thinwire-core/keychain-security-cli"]
# Pixel snapshots. Off in the default test job. The ui-snapshots CI job turns it on.
ui-snapshots = ["egui_kittest/snapshot", "egui_kittest/wgpu"]

[dependencies]
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
# Image decode for chat photos. jpeg, png, and webp only. eframe stays on
# glow (ADR 0002): do not enable wgpu here.
egui_extras = { version = "0.37", default-features = false, features = [
  "image",
] }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
# Voice notes and audio files. `playback` is the output device. rodio
# 0.23's symphonia features decode Vorbis, AAC (`mp4`: M4A and ADTS), MP3,
# WAV, and FLAC, not Opus. Telegram, WhatsApp, and Discord voice notes are
# Opus in Ogg, so `ogg` and `opus` decode that file in `app/audio/engine.rs`.
# Signal voice notes are AAC.
rodio = { version = "0.23", default-features = false, features = [
  "playback",
  "vorbis",
  "mp4",
  "mp3",
  "wav",
  "flac",
] }
ogg = "0.9"
opus = "0.4"
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
# `hardened` rejects every scheme except http and https (webbrowser 1.2).
webbrowser = { version = "1.2", features = ["hardened"] }
# Host display for the link confirm dialog. `host_str` is the punycode form.
url = "2"
# The file list of a paste from a file manager. egui-winit already links it.
arboard = "3.6"
# The cache folder for pasted images.
dirs.workspace = true
# SHA-256 of a nightly archive, and the tar a Windows build unpacks.
# `rust_backend` keeps flate2 on the Rust inflater. Linux tests hash and
# extract with no C zlib and no network.
sha2 = "0.11"
tar = "0.4"
flate2 = { version = "1.1", default-features = false, features = [
  "rust_backend",
] }
serde.workspace = true
serde_json.workspace = true
thinwire-core.workspace = true
thinwire-notify.workspace = true
thinwire-protocol.workspace = true
winit.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# QR for the Signal provisioning URI and the WhatsApp pairing payload.
# Features `signal-local` and `whatsapp-web` only. No new crate: `qrcode`
# is already on the Signal feature (ADR 0013 license list is unchanged).
qrcode = { version = "0.14", optional = true, default-features = false }

# Linux: the settings portal reports reduce-motion and sends SettingChanged.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = [
  "async-io",
  "blocking-api",
] }

# Windows: "Show animations" and its change event. Same windows-rs as
# thinwire-notify. WinRT only: the workspace forbids unsafe.
# The nightly check uses the OS TLS stack (`native-tls` is SChannel here).
# It is not a dependency of the Linux or macOS build.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "UI_ViewManagement"] }
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }

# The Dock icon goes while the app closes in the background. Same versions
# as eframe's AppKit bindings in Cargo.lock: no second copy.
# Reduce Motion is NSWorkspace, behind the NSAccessibility feature.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSAccessibility",
  "NSApplication",
  "NSResponder",
  "NSRunningApplication",
  "NSWorkspace",
] }

[dev-dependencies]
# A zone with daylight saving time for the layout tests (#122).
chrono-tz = "0.10"
egui_kittest = { version = "0.37", default-features = false }
thinwire-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
