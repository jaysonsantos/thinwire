<?xml version="1.0" encoding="UTF-8"?>
<!-- thinwire app icon: the "t" mark of the sidebar on the macOS icon grid.
     Source for scripts/make-icons.sh. The "t" is plain strokes, no font. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6AA6FF"/>
      <stop offset="1" stop-color="#1F5BDB"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#body)" filter="url(#shadow)"/>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 482 280 L 482 610 Q 482 730 602 730 L 660 730" stroke-width="120"/>
    <path d="M 362 430 L 640 430" stroke-width="110"/>
  </g>
</svg>
