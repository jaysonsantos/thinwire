[package]
name = "thinwire-whatsapp"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "WhatsApp linked-device adapter and its helper program (AGPL-3.0-only)."

# The helper program of ADR 0013. The MIT app starts it as a child process
# and talks to it over stdin and stdout. Without `whatsapp-web` it has no
# client: that build is only for the process tests in default CI.
[[bin]]
name = "thinwire-whatsapp-helper"
path = "src/bin/helper.rs"

[features]
default = []
# Experimental WhatsApp Web / linked-device client (oxidezap whatsapp-rust).
# It links the AGPL `wacore-libsignal`. Release builds turn it on for the
# helper program only (ADR 0013). No MIT crate depends on this crate. The
# git revision is pinned so the spike builds on stable Rust. Not a supported
# messenger. `sqlite-storage` (not `sqlite-storage-bundled`) so the lock can
# use libsqlite3-sys 0.36. The 0.38 pin cannot share the graph with the
# Signal sqlite store. The bundled build is the direct dependency below.
whatsapp-web = [
  "dep:whatsapp-rust",
  "dep:libsqlite3-sys",
  "dep:diesel",
  "dep:rusqlite",
  "dep:thinwire-core",
  "thinwire-protocol/session-cipher",
]

[dependencies]
# The command line of the helper program.
clap.workspace = true
dirs.workspace = true
thinwire-protocol.workspace = true
# `io-std`: the helper talks over its stdin and stdout.
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
# The log of the helper program. The tests also read log lines with it (#238).
tracing-subscriber.workspace = true
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "4e3c8fb12f006284415b60287eeae8fdab7e5a22", optional = true, default-features = false, features = [
  "sqlite-storage",
  "tokio-transport",
  "tokio-runtime",
  "ureq-client",
  "tokio-native",
] }
# Same SQLCipher build as the Signal helper. Vendored OpenSSL keeps the
# helper off the system libssl. The key lives in the OS keychain.
libsqlite3-sys = { version = "0.36", optional = true, default-features = false, features = [
  "bundled-sqlcipher-vendored-openssl",
] }
# The connection hook sets the raw key. `sqlite` does not bundle a second SQLite.
diesel = { version = "2.3.14", optional = true, default-features = false, features = [
  "sqlite",
] }
rusqlite = { version = "0.38", optional = true, default-features = false, features = [
  "bundled-sqlcipher-vendored-openssl",
] }
thinwire-core = { workspace = true, optional = true }

[dev-dependencies]
# The adapter contract kit (ADR 0010) for the tests.
thinwire-protocol = { workspace = true, features = ["contract-kit"] }
# The wire lines, for the tests that talk to the helper process directly.
thinwire-ipc.workspace = true
# whatsapp-rust logs with the `log` crate. The helper test sends a `log`
# record through the same bridge as the helper program.
log = "0.4"
tracing-log = "0.2"

[lints]
workspace = true
