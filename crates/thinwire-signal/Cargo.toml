[package]
name = "thinwire-signal"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Signal linked-device adapter and its helper program (AGPL-3.0-only)."

# The helper program of ADR 0013. The MIT app starts it as a child process
# and talks to it over stdin and stdout. Without `signal-local` it has no
# client: that build is only for the process tests in default CI.
[[bin]]
name = "thinwire-signal-helper"
path = "src/bin/helper.rs"

[features]
default = []
# Links Presage and libsignal (AGPL-3.0). Release builds turn it on for the
# helper program only (ADR 0013, #248). No MIT crate depends on this crate.
# Default CI stays off.
signal-local = [
  "dep:presage",
  "dep:presage-store-sqlite",
  "dep:futures",
  "dep:libsqlite3-sys",
  "dep:sqlx",
  "dep:rusqlite",
  "dep:thinwire-core",
  "thinwire-protocol/session-cipher",
]

[dependencies]
# The command line of the helper program.
clap.workspace = true
dirs.workspace = true
sha2 = "0.11.0"
thinwire-protocol.workspace = true
# `io-std`: the helper talks over its stdin and stdout.
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
# The log of the helper program.
tracing-subscriber.workspace = true
presage = { git = "https://github.com/whisperfish/presage", rev = "6f630791b2c7bf3d5b00c75f5a6c94131bf79c8c", optional = true, default-features = false }
# Default features of this crate build SQLCipher. This edge stays off so the
# helper picks the SQLCipher build below, not a second SQLite.
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "6f630791b2c7bf3d5b00c75f5a6c94131bf79c8c", optional = true, default-features = false }
# Bundled SQLCipher and vendored OpenSSL. The helper does not need a system
# libsqlite or libssl. The key lives in the OS keychain, not in this file.
libsqlite3-sys = { version = "0.36", optional = true, default-features = false, features = [
  "bundled-sqlcipher-vendored-openssl",
] }
rusqlite = { version = "0.38", optional = true, default-features = false, features = [
  "bundled-sqlcipher-vendored-openssl",
] }
thinwire-core = { workspace = true, optional = true }
futures = { version = "0.3", optional = true, default-features = false, features = [
  "std",
] }
# The history page query. presage `messages()` has no row limit. Same sqlx
# 0.9 line presage-store-sqlite already builds.
sqlx = { version = "0.9.0", optional = true, default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "uuid",
] }

[dev-dependencies]
chrono.workspace = true
# The adapter contract kit (ADR 0010) for the tests.
thinwire-protocol = { workspace = true, features = ["contract-kit"] }
# The wire lines, for the tests that talk to the helper process directly.
thinwire-ipc.workspace = true
# The helper test sends a `log` record through the same bridge as the
# helper program.
log = "0.4"
tracing-log = "0.2"

[lints]
workspace = true
