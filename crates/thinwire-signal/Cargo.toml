[package]
name = "thinwire-signal"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Local-only Signal adapter (AGPL-3.0-only). Not in release builds."

[features]
default = []
# Links Presage and libsignal. thinwire enables this only through its
# `signal-local` feature. Default CI stays off.
signal-local = ["dep:presage", "dep:presage-store-sqlite", "dep:futures"]

[dependencies]
dirs.workspace = true
sha2 = "0.11.0"
thinwire-protocol.workspace = true
tokio.workspace = true
tracing.workspace = true
presage = { git = "https://github.com/whisperfish/presage", rev = "33dd1491130793390e356e15a5711f1e6ca14fdb", optional = true, default-features = false }
# Default features build SQLCipher and need OpenSSL headers. The session file
# is mode 0700 under app-data, same as the old sled directory. No passphrase.
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "33dd1491130793390e356e15a5711f1e6ca14fdb", optional = true, default-features = false }
futures = { version = "0.3", optional = true, default-features = false, features = [
  "std",
] }

[dev-dependencies]
chrono.workspace = true

[lints]
workspace = true
