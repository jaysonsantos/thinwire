[package]
name = "thinwire-signal"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Local-only Signal adapter (AGPL-3.0-only). Not in release builds."

[features]
default = []
# Links Presage and libsignal. thinwire enables this only through its
# `signal-local` feature. Default CI stays off.
signal-local = [
  "dep:presage",
  "dep:presage-store-sqlite",
  "dep:futures",
  "dep:libsqlite3-sys",
  "dep:sqlx",
]

[dependencies]
dirs.workspace = true
sha2 = "0.11.0"
thinwire-protocol.workspace = true
tokio.workspace = true
tracing.workspace = true
presage = { git = "https://github.com/whisperfish/presage", rev = "b44d0129348fffde7455214bc081859dcf2fd242", optional = true, default-features = false }
# Default features build SQLCipher and need OpenSSL headers. The session file
# is mode 0700 under app-data, same as the old sled directory. No passphrase.
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "b44d0129348fffde7455214bc081859dcf2fd242", optional = true, default-features = false }
# Bundled SQLite, same 0.36 line as WhatsApp. A signal-local build does not
# need a system libsqlite. SQLCipher stays off (no OpenSSL headers).
libsqlite3-sys = { version = "0.36", optional = true, default-features = false, features = [
  "bundled",
] }
futures = { version = "0.3", optional = true, default-features = false, features = [
  "std",
] }
# The history page query. presage `messages()` has no row limit. Same sqlx
# 0.9 line presage-store-sqlite already builds.
sqlx = { version = "0.9.0", optional = true, default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "uuid",
] }

[dev-dependencies]
chrono.workspace = true
# The adapter contract kit (ADR 0010) for the tests.
thinwire-protocol = { workspace = true, features = ["contract-kit"] }

[lints]
workspace = true
