[package]
name = "thinwire-signal"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Local-only Signal adapter (AGPL-3.0-only). Not in release builds."

[features]
default = []
# Links Presage and libsignal. thinwire enables this only through its
# `signal-local` feature. Default CI stays off.
signal-local = ["dep:presage", "dep:presage-store-sled", "dep:futures"]

[dependencies]
dirs.workspace = true
sha2 = "0.10.9"
thinwire-protocol.workspace = true
tokio.workspace = true
tracing.workspace = true
presage = { git = "https://github.com/whisperfish/presage", rev = "d3a760088617b657b41ccd4f43e4629e3c3188ac", optional = true, default-features = false }
presage-store-sled = { git = "https://github.com/whisperfish/presage", rev = "d3a760088617b657b41ccd4f43e4629e3c3188ac", optional = true }
futures = { version = "0.3", optional = true, default-features = false, features = [
  "std",
] }

[lints]
workspace = true
