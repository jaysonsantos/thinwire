[package]
name = "thinwire-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Protocol adapters and capability metadata for thinwire"

[features]
default = []
# Live official TDLib client via `tdlib-rs`. Default CI stays feature-off so
# jobs do not download or link system TDLib. Local builds: install is handled
# by the crate's `download-tdlib` feature. Never put api_id / api_hash in CI.
telegram-tdlib = ["dep:tdlib-rs"]

[dependencies]
tdlib-rs = { version = "1.4", optional = true, default-features = false, features = [
  "download-tdlib",
] }
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
