[package]
name = "thinwire-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Protocol adapters and capability metadata for thinwire"

[features]
default = []
# Live official TDLib client via `tdlib-rs`. Default CI and pull_request
# workflows stay feature-off so they do not download or link TDLib.
# `download-tdlib` fetches the prebuilt archive; `static` links it into the
# binary. Linux link needs libc++-dev and libc++abi-dev. Publisher
# api_id / api_hash stay compile-time env (credentials.rs). Public CI must
# not set them. Main-only os-zips injects repository secrets.
telegram-tdlib = ["dep:tdlib-rs"]
# Official Slack workspace app via `slack-morphism`: OAuth v2 install on a
# loopback redirect, Web API and Socket Mode over its `hyper` client. Default
# CI stays feature-off. Publisher client credentials stay compile-time env in
# `slack/credentials.rs`. Public CI must not set them.
slack-oauth = [
  "dep:slack-morphism",
  "slack-morphism/hyper",
  "dep:webbrowser",
  "dep:rustls",
]
# Experimental WhatsApp Web / linked-device client (MIT, oxidezap).
# Git revision matches ZapFast 0.14 so the spike builds on stable Rust.
# Default CI does not enable this feature. Not a supported messenger.
# `sqlite-storage` (not `sqlite-storage-bundled`) so the lock can use
# libsqlite3-sys 0.36. The 0.38 pin cannot share the graph with the
# Signal sqlite store. The bundled build is the direct dependency below.
whatsapp-web = ["dep:whatsapp-rust", "dep:libsqlite3-sys"]
# Bot/OAuth guild inbox spike via twilight. Default CI stays feature-off.
# No user-token client. Never put a Discord token in CI or the MIT tree.
discord-bot = ["dep:twilight-http", "dep:twilight-model", "dep:rustls"]
# Test support: the adapter contract kit (`thinwire_protocol::contract`,
# ADR 0010) for adapter crates such as thinwire-signal. Only a
# dev-dependency turns it on. The app never does.
contract-kit = []

[dependencies]
tdlib-rs = { version = "1.4", optional = true, default-features = false, features = [
  "download-tdlib",
  "static",
] }
slack-morphism = { version = "2.29", optional = true, default-features = false }
webbrowser = { version = "1", optional = true }
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f7468ae2920a2b0aedbd0848cf121de56a07f93c", optional = true, default-features = false, features = [
  "sqlite-storage",
  "tokio-transport",
  "tokio-runtime",
  "ureq-client",
  "tokio-native",
] }
# Same 0.36 line as the Signal sqlite store. `bundled` keeps WhatsApp off the system libsqlite.
libsqlite3-sys = { version = "0.36", optional = true, default-features = false, features = [
  "bundled",
] }
twilight-http = { version = "0.17.1", optional = true }
twilight-model = { version = "0.17.1", optional = true }
# twilight-http 0.17 and hyper-rustls leave rustls without a process crypto
# provider. `ring` is the single provider for the Discord and Slack clients.
rustls = { version = "0.23", optional = true, default-features = false, features = [
  "ring",
] }
dirs.workspace = true
getrandom = "0.4"
tokio = { workspace = true, features = ["io-util", "net"] }
tracing.workspace = true

[lints]
workspace = true
