[package]
name = "thinwire-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Frontend-independent thinwire state, intents, and change signal"

# ADR 0010: no egui, eframe, or winit here. `scripts/check-core-deps.sh`
# fails the test run if one of them shows up in `cargo tree`.
[features]
default = []
# Protocol features live here. The frontend crate forwards them.
telegram-tdlib = ["thinwire-protocol/telegram-tdlib"]
slack-oauth = ["thinwire-protocol/slack-oauth"]
# Experimental spike. Default CI and the default UI stay feature-off.
whatsapp-web = ["thinwire-protocol/whatsapp-web"]
discord-bot = ["thinwire-protocol/discord-bot"]
# Local-only Signal chrome. The AGPL client is `thinwire-signal`, not this crate.
signal-local = []
# Test hooks on `SecretStore` for other workspace crates. Never in a release.
test-support = []

[dependencies]
dirs.workspace = true
keyring-core.workspace = true
thinwire-protocol.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store.workspace = true
zbus-secret-service-keyring-store.workspace = true
secret-service.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
