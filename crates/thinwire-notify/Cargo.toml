[package]
name = "thinwire-notify"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "OS desktop notifications for thinwire, off the UI thread (#32)"

# No egui here: a TUI frontend can use this crate too.
[dependencies]
thinwire-core.workspace = true
tracing.workspace = true

# freedesktop D-Bus through pure-Rust zbus (no libdbus). macOS uses
# mac-notification-sys through it. All MIT or Apache-2.0.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
notify-rust = { version = "4.18", default-features = false, features = ["z"] }

# `CloseNotification` by id: notify-rust closes only through the handle
# that the click waiter owns. Same zbus as the keychain; no new major.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = [
  "async-io",
  "blocking-api",
] }

# WinRT toasts with a tag, a group, and a click (#161). windows-registry
# writes the app id key with a safe API: the workspace forbids unsafe.
# MIT or Apache-2.0, the windows-rs versions that Cargo.lock already has.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
] }
windows-registry = "0.100"

[lints]
workspace = true
